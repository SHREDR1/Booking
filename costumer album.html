<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Service Album</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f8f9fa;
    }

    header {
      background: #2c3e50;
      color: white;
      text-align: center;
      padding: 15px 0;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 0 20px;
    }

    /* The Dropdown/Accordion Button Label */
    .accordion-btn {
      background-color: #34495e;
      color: white;
      cursor: pointer;
      padding: 14px 20px;
      width: 100%;
      text-align: left;
      border: none;
      outline: none;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      transition: background 0.3s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .accordion-btn:hover {
      background-color: #2c3e50;
    }

    /* Arrow icon styling */
    .accordion-btn::after {
      content: '\02795'; /* Plus sign */
      font-size: 14px;
    }

    .accordion-btn.active::after {
      content: '\2796'; /* Minus sign */
    }

    /* The collapsible panel containing images */
    .panel {
      padding: 0 15px;
      background-color: white;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
      border-radius: 0 0 6px 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    /* Gallery Grid inside the panel */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      padding: 20px 0;
    }

    .gallery-grid img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <header>
    <h1>Our Service Gallery</h1>
    <p style="margin-top: 5px; font-size: 14px;">Professional Quality and Excellence</p>
  </header>

  <div class="container">
    
    <!-- Collapsible Button Label -->
    <button class="accordion-btn">View Attached Service Images</button>
    
    <!-- Expandable Content Panel -->
    <div class="panel">
      <div class="gallery-grid">
        <img src="service1.jpg" alt="Service 1">
        <img src="service2.jpg" alt="Service 2">
        <img src="service3.jpg" alt="Service 3">
        <img src="service4.jpg" alt="Service 4">
        <img src="service5.jpg" alt="Service 5">
      </div>
    </div>

  </div>

  <script>
    var acc = document.getElementsByClassName("accordion-btn");
    var i;

    for (i = 0; i < acc.length; i++) {
      acc[i].addEventListener("click", function() {
        this.classList.toggle("active");
        var panel = this.nextElementSibling;
        if (panel.style.maxHeight) {
          panel.style.maxHeight = null;
        } else {
          panel.style.maxHeight = panel.scrollHeight + "px";
        }
      });
    }
  </script>

</body>
</html>
