<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCHO Ventures - Account Access</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(
        180deg,
        #06090f 0%,
        #0b1220 30%,
        #111827 60%,
        #0a1018 100%
    );
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:white;
}

.container{
    width:420px;
    background:#131c2b;
    border:1px solid rgba(212,175,55,.25);
    border-radius:15px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.logo{
    text-align:center;
    font-size:32px;
    color:#D4AF37;
    font-weight:bold;
    letter-spacing:5px;
}

h2{
    margin-top:15px;
    text-align:center;
}

.subtitle{
    text-align:center;
    color:#bfbfbf;
    margin:10px 0 35px;
    font-size:14px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

input[type="text"],
input[type="email"],
input[type="password"]{
    width:100%;
    padding:14px;
    border-radius:8px;
    border:1px solid #333;
    background:#1d2738;
    color:white;
    margin-bottom:18px;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#D4AF37;
}

.checkbox{
    display:flex;
    align-items:flex-start;
    gap:10px;
    margin:10px 0 25px;
    font-size:14px;
}

.checkbox input{
    width:18px;
    height:18px;
    margin-top:2px;
}

.submit-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:30px;
    background:#D4AF37;
    color:#111;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.submit-btn:hover{
    background:white;
}

.divider{
    text-align:center;
    margin:25px 0;
    color:#bfbfbf;
    position:relative;
}

.divider::before,
.divider::after{
    content:"";
    position:absolute;
    top:50%;
    width:33%;
    height:1px;
    background:#555;
}

.divider::before{
    left:0;
}

.divider::after{
    right:0;
}

.social-buttons{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.social-btn{
    width:100%;
    padding:13px;
    border-radius:30px;
    border:1px solid #555;
    background:transparent;
    color:white;
    cursor:pointer;
    font-size:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition:.3s;
}

.social-btn:hover{
    border-color:#D4AF37;
    color:#D4AF37;
}

.switch-view{
    text-align:center;
    margin-top:25px;
    color:#cfcfcf;
}

.switch-view a{
    color:#D4AF37;
    text-decoration:none;
    font-weight:bold;
}

.switch-view a:hover{
    text-decoration:underline;
}

@media(max-width:480px){
    .container{
        width:92%;
        padding:30px 20px;
    }
}

/* =========================================
   STAGGERED ONE-BY-ONE REVEAL ANIMATION
========================================= */
.reveal-item {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s ease, transform 0.8s cubic-bezier(.22,1,.36,1);
}

.reveal-item.visible {
    opacity: 1;
    transform: translateY(0);
}
</style>
</head>

<body>

<div class="container">

    <!-- ================= LOGIN FORM ================= -->
    <div id="login-section">
        <div class="logo reveal-item">OCHO</div>
        <h2 class="reveal-item">Welcome Back</h2>
        <p class="subtitle reveal-item">Log in to your OCHO Ventures account.</p>

        <form id="login-form" onsubmit="handleLoginSubmit(event)">
            <label class="reveal-item">Email Address *</label>
            <input type="email" id="login-email" placeholder="Enter your email" class="reveal-item" required>

            <label class="reveal-item">Password *</label>
            <input type="password" id="login-password" placeholder="Enter your password" class="reveal-item" required>

            <button class="submit-btn reveal-item" type="submit" id="login-submit-btn">Log In</button>
        </form>

        <div class="divider reveal-item">Or continue with</div>

        <div class="social-buttons">
            <button type="button" class="social-btn reveal-item" onclick="openGoogleAccountChooser()">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.13C3.26 21.3 7.31 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.63H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.37l3.99-3.13z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.63l3.99 3.13c.95-2.85 3.6-4.96 6.72-4.96z"/>
                </svg>
                Continue with Google
            </button>
            <button class="social-btn reveal-item">Continue with Facebook</button>
            <button class="social-btn reveal-item">Continue with Apple</button>
        </div>

        <div class="switch-view reveal-item">
            Don't have an account? <a href="#" onclick="showCreateAccount(event)">Sign Up</a>
        </div>
    </div>


    <!-- ================= CREATE ACCOUNT FORM ================= -->
    <div id="create-section" style="display: none;">
        <div class="logo reveal-item">OCHO</div>
        <h2 class="reveal-item">Create an Account</h2>
        <p class="subtitle reveal-item">Join OCHO Ventures to enjoy our services.</p>

        <form id="create-form" onsubmit="handleCreateSubmit(event)">
            <label class="reveal-item">Full Name *</label>
            <input type="text" id="create-name" placeholder="Enter your full name" class="reveal-item" required>

            <label class="reveal-item">Email Address *</label>
            <input type="email" id="create-email" placeholder="Enter your email" class="reveal-item" required>

            <label class="reveal-item">Password *</label>
            <input type="password" id="create-password" placeholder="Create a password" class="reveal-item" required>

            <label class="reveal-item">Confirm Password *</label>
            <input type="password" id="create-confirm-password" placeholder="Confirm your password" class="reveal-item" required>

            <div class="checkbox reveal-item">
                <input type="checkbox" required>
                <span>
                    I agree to the <a href="#" style="color:#D4AF37;">Terms of Service</a>
                    and <a href="#" style="color:#D4AF37;">Privacy Policy</a>.
                </span>
            </div>

            <button class="submit-btn reveal-item" type="submit">Create Account</button>
        </form>

        <div class="divider reveal-item">Or continue with</div>

        <div class="social-buttons">
            <button type="button" class="social-btn reveal-item" onclick="openGoogleAccountChooser()">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.13C3.26 21.3 7.31 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.63H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.37l3.99-3.13z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.63l3.99 3.13c.95-2.85 3.6-4.96 6.72-4.96z"/>
                </svg>
                Continue with Google
            </button>
            <button class="social-btn reveal-item">Continue with Facebook</button>
            <button class="social-btn reveal-item">Continue with Apple</button>
        </div>

        <div class="switch-view reveal-item">
            Already have an account? <a href="#" onclick="showLogin(event)">Log In</a>
        </div>
    </div>

</div>

<script>
/* =========================================
   STAGGERED REVEAL LOGIC & VIEW SWITCHING
========================================= */
function triggerStagger(sectionId) {
    const container = document.getElementById(sectionId);
    const items = container.querySelectorAll(".reveal-item");
    const STAGGER_DELAY = 80; 

    items.forEach(item => item.classList.remove("visible"));

    items.forEach((item, index) => {
        setTimeout(() => {
            item.classList.add("visible");
        }, index * STAGGER_DELAY);
    });
}

function showCreateAccount(e) {
    if(e) e.preventDefault();
    document.getElementById("login-section").style.display = "none";
    document.getElementById("create-section").style.display = "block";
    triggerStagger("create-section");
}

function showLogin(e) {
    if(e) e.preventDefault();
    document.getElementById("create-section").style.display = "none";
    document.getElementById("login-section").style.display = "block";
    triggerStagger("login-section");
}

/* =========================================
   ACCOUNT CREATION & LOGIN LOGIC
========================================= */
function handleCreateSubmit(e) {
    e.preventDefault();

    const name = document.getElementById("create-name").value;
    const email = document.getElementById("create-email").value;
    const password = document.getElementById("create-password").value;
    const confirmPassword = document.getElementById("create-confirm-password").value;

    if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
    }

    let users = JSON.parse(localStorage.getItem("ocho_users")) || [];

    const existingUser = users.find(user => user.email === email);
    if (existingUser) {
        alert("An account with this email already exists!");
        return;
    }

    users.push({ name, email, password });
    localStorage.setItem("ocho_users", JSON.stringify(users));

    alert("Account created successfully! Please log in.");
    document.getElementById("create-form").reset();
    showLogin();
}

function handleLoginSubmit(e) {
    e.preventDefault();

    const email = document.getElementById("login-email").value;
    const password = document.getElementById("login-password").value;

    let users = JSON.parse(localStorage.getItem("ocho_users")) || [];

    const validUser = users.find(user => user.email === email && user.password === password);

    if (validUser) {
        // Mark user session as active
        localStorage.setItem("isLoggedIn", "true");
        
        alert("Login successful! Welcome back, " + validUser.name);

        // Check if there's a redirected room booking waiting
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get('redirect');

        if (redirectUrl) {
            window.location.href = decodeURIComponent(redirectUrl);
        } else {
            window.location.href = "book now.html";
        }
    } else {
        alert("Invalid username or password!");
    }
}

/* =========================================
   GOOGLE AUTHENTICATION POPUP LOGIC
========================================= */
const GOOGLE_CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com";
const REDIRECT_URI = window.location.href.split('#')[0].split('?')[0];

function openGoogleAccountChooser() {
    if (GOOGLE_CLIENT_ID === "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com") {
        alert("To enable real Google Sign-In, update 'GOOGLE_CLIENT_ID' in the script with your Client ID from the Google Cloud Console.");
        return;
    }

    const googleAuthUrl = `https://accounts.google.com/o/oauth2/v2/auth?` +
        `client_id=${encodeURIComponent(GOOGLE_CLIENT_ID)}` +
        `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
        `&response_type=token` +
        `&scope=${encodeURIComponent('https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email')}` +
        `&prompt=select_account`;

    const width = 500, height = 600;
    const left = (window.screen.width / 2) - (width / 2);
    const top = (window.screen.height / 2) - (height / 2);

    window.open(googleAuthUrl, 'GoogleAccountChooser', `width=${width},height=${height},top=${top},left=${left},scrollbars=yes`);
}

// Initial trigger on load
document.addEventListener("DOMContentLoaded", () => {
    triggerStagger("login-section");
});
</script>

</body>
</html>
